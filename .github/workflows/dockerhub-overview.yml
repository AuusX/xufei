name: Docker Hub Overview

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/dockerhub-overview.mjs
      - .github/workflows/dockerhub-overview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-overview
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'zhiyingzzhou/renewlet' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Generate Docker Hub overview
        # Overview 只同步 main 的稳定文档元数据；它与不可变镜像和 Release 制品隔离，失败不能阻断发布。
        run: node scripts/dockerhub-overview.mjs --ref "${GITHUB_SHA}" --output tmp/dockerhub/README.md --check

      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zhiyingzzhou/renewlet
          short-description: Self-hosted subscription ledger and renewal reminders
          readme-filepath: ./tmp/dockerhub/README.md
