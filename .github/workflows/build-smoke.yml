name: Build Smoke

# 面向 fork、PR 和 dev 分支的无密钥构建冒烟；main/release 发布构建由 PR 与 tag workflow 覆盖。
on:
  pull_request:
    branches:
      - dev
      - main
      - "release/**"
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve build time
        run: echo "RENEWLET_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Validate deployment config
        run: pnpm check:deploy

      - name: Check Cloudflare build path
        run: pnpm check:cloudflare

      - name: Build Cloudflare assets
        env:
          RENEWLET_VERSION: 0.0.0-dev
          RENEWLET_COMMIT: ${{ github.sha }}
        # Cloudflare 冒烟只产出本地静态资产和 Worker bundle，不应用 D1 migration，也不需要账号 secrets。
        run: pnpm build:cloudflare

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Docker build smoke
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=0.0.0-dev
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.RENEWLET_BUILD_TIME }}
          platforms: linux/amd64
          load: true
          push: false
          # 单平台 smoke 显式加载本地镜像，既避免 Buildx 无输出告警，也为下游运行态探针提供唯一产物。
          tags: renewlet:smoke

      - name: Verify Docker runtime health
        run: |
          set -euo pipefail
          container_id=""
          cleanup() {
            if [[ -n "$container_id" ]]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
          }
          wait_for_health() {
            local label="$1"
            for attempt in {1..30}; do
              if docker exec "$container_id" /renewlet healthcheck >/dev/null 2>&1; then
                echo "Renewlet Docker ${label} healthcheck passed."
                return 0
              fi
              if [[ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]]; then
                echo "Renewlet ${label} container exited before becoming healthy." >&2
                docker logs "$container_id" >&2
                return 1
              fi
              sleep 1
            done
            echo "Renewlet ${label} container did not become healthy within 30 seconds." >&2
            docker logs "$container_id" >&2
            return 1
          }
          # 成功、超时或容器提前退出都走同一清理路径，避免 runner 留下影响后续检查的实例。
          trap cleanup EXIT

          # 多阶段构建成功只证明文件存在；必须从最终 runner 内调用真实二进制健康检查验证可启动性。
          docker run --rm renewlet:smoke --version
          docker run --rm --entrypoint /docker-entrypoint.sh renewlet:smoke --version
          # Docker 覆盖 entrypoint 时会清空镜像 CMD；显式传入生产参数才能真实验证旧入口的服务启动能力。
          container_id="$(docker run --detach --entrypoint /docker-entrypoint.sh renewlet:smoke serve --http=0.0.0.0:3000 --dir=/pb_data --encryptionEnv=PB_ENCRYPTION_KEY)"
          wait_for_health "legacy entrypoint"
          docker rm --force "$container_id" >/dev/null
          container_id=""

          container_id="$(docker run --detach renewlet:smoke)"
          wait_for_health "default entrypoint"
